<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Outer silhouette: hand-traceable Bézier path, equivalent to a Pen Tool path -->
    <path id="outerPath" d="
      M 112 0
      C 46 0 0 46 0 112
      L 0 400
      C 0 466 46 512 112 512
      L 400 512
      C 466 512 512 466 512 400
      L 512 112
      C 512 46 466 0 400 0 Z"/>

    <!-- Mask used to create the inset dark face without embedding/rasterizing the source image -->
    <mask id="faceMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="black"/>
      <path d="
        M 113 14
        C 55 14 14 55 14 113
        L 14 399
        C 14 457 55 498 113 498
        L 399 498
        C 457 498 498 457 498 399
        L 498 113
        C 498 55 457 14 399 14 Z" fill="white"/>
    </mask>
  </defs>

  <!-- Outer Pen Tool path -->
