<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <!-- 深色底 -->
  <rect width="80" height="80" rx="20" fill="#1a1a2e"/>
  <!-- 背景渐变 -->
  <rect width="80" height="80" rx="20" fill="url(#bg)"/>
  <!-- 左上 - 高亮紫色 -->
  <rect x="16" y="16" width="20" height="20" rx="6" fill="rgba(167,139,250,0.6)" stroke="#a78bfa" stroke-width="2"/>
  <!-- 右上 -->
  <rect x="44" y="16" width="20" height="20" rx="6" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <!-- 左下 -->
  <rect x="16" y="44" width="20" height="20" rx="6" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <!-- 右下 -->
  <rect x="44" y="44" width="20" height="20" rx="6" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
</svg>
