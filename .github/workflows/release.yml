name: release

on:
  workflow_dispatch:

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: prepare release metadata
        id: release_meta
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $cargoTomlLines = Get-Content -LiteralPath src-tauri/Cargo.toml -Encoding UTF8
          $inPackageSection = $false
          $cargoVersion = $null

          foreach ($line in $cargoTomlLines) {
            if ($line -match '^\s*\[package\]\s*$') {
              $inPackageSection = $true
              continue
            }

            if ($inPackageSection -and $line -match '^\s*\[') {
              break
            }

            if ($inPackageSection -and $line -match '^\s*version\s*=\s*"([^"]+)"\s*$') {
              $cargoVersion = $Matches[1]
              break
            }
          }

          if (-not $cargoVersion) {
            throw 'Unable to read version from the [package] section of src-tauri/Cargo.toml.'
          }

          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }

          $releaseNotesPath = "docs/RELEASE_NOTES/v$packageVersion.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
            throw "Release notes not found: $releaseNotesPath"
          }

          $releaseBody = Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8
          $delimiter = [guid]::NewGuid().Guid

          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_notes_path=$releaseNotesPath" >> $env:GITHUB_OUTPUT
          "release_body<<$delimiter" >> $env:GITHUB_OUTPUT
          $releaseBody >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: build and publish release
        id: tauri_release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.release_meta.outputs.version }}
          releaseName: DesktopGo v${{ steps.release_meta.outputs.version }}
          releaseBody: ${{ steps.release_meta.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: "[name]_[version]_[arch][setup]-zh-CN[ext]"

      - name: build localized installers
        shell: pwsh
        run: pnpm run build:installers

      - name: upload localized installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_meta.outputs.version }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/DesktopGo_${{ steps.release_meta.outputs.version }}_x64-setup-zh-CN.exe
            src-tauri/target/release/bundle/nsis/DesktopGo_${{ steps.release_meta.outputs.version }}_x64-setup-en-US.exe
