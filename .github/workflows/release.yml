name: release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: prepare release metadata
        id: release_meta
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $cargoTomlLines = Get-Content -LiteralPath src-tauri/Cargo.toml -Encoding UTF8
          $inPackageSection = $false
          $cargoVersion = $null

          foreach ($line in $cargoTomlLines) {
            if ($line -match '^\s*\[package\]\s*$') {
              $inPackageSection = $true
              continue
            }

            if ($inPackageSection -and $line -match '^\s*\[') {
              break
            }

            if ($inPackageSection -and $line -match '^\s*version\s*=\s*"([^"]+)"\s*$') {
              $cargoVersion = $Matches[1]
              break
            }
          }

          if (-not $cargoVersion) {
            throw 'Unable to read version from the [package] section of src-tauri/Cargo.toml.'
          }

          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }

          $releaseNotesPath = "docs/RELEASE_NOTES/v$packageVersion.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
            throw "Release notes not found: $releaseNotesPath"
          }

          $runNumber = $env:GITHUB_RUN_NUMBER
          $runAttempt = $env:GITHUB_RUN_ATTEMPT
          if ([string]::IsNullOrWhiteSpace($runNumber) -or $runNumber -notmatch '^[1-9]\d*$') {
            throw "Invalid or missing GITHUB_RUN_NUMBER: '$runNumber'"
          }

          if ([string]::IsNullOrWhiteSpace($runAttempt) -or $runAttempt -notmatch '^[1-9]\d*$') {
            throw "Invalid or missing GITHUB_RUN_ATTEMPT: '$runAttempt'"
          }

          $buildId = "$runNumber.$runAttempt"
          $releaseTag = "v$packageVersion-test.$buildId"
          $releaseName = "DesktopGo 测试构建 v$packageVersion（构建 $buildId）"
          $releaseNotes = Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8
          $releaseBody = @"
> [!WARNING]
> **测试构建**：应用版本 $packageVersion，运行号 $runNumber，重试序号 $runAttempt（构建号 $buildId）。
> 发布前请核对标题、说明和附件。

$releaseNotes
"@
          $delimiter = [guid]::NewGuid().Guid

          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_notes_path=$releaseNotesPath" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "release_body<<$delimiter" >> $env:GITHUB_OUTPUT
          $releaseBody >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: build and publish release
        id: tauri_release
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_meta.outputs.release_tag }}
          releaseName: ${{ steps.release_meta.outputs.release_name }}
          releaseBody: ${{ steps.release_meta.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          includeUpdaterJson: true
          assetNamePattern: "[name]_[version]_[arch][setup][ext]"
          retryAttempts: 3
